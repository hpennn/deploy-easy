<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css" />
    <title>智能部署助手 - DEBUG</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        background: #0d1117; 
        color: #e6edf3; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        line-height: 1.6;
      }
      #debug-info {
        background: #161b22;
        border: 2px solid #30363d;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      #debug-info h2 { color: #58a6ff; margin-bottom: 12px; font-size: 18px; }
      #debug-info pre { 
        background: #0d1117; 
        padding: 12px; 
        border-radius: 6px; 
        overflow-x: auto;
        font-size: 13px;
        color: #3fb950;
      }
      #app-container { 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        max-width: 960px; 
        margin: 0 auto; 
      }
      .success { color: #3fb950; }
      .error { color: #f85149; }
      .warning { color: #d29922; }
    </style>
  </head>
  <body>
    <div id="debug-info">
      <h2>🔍 调试信息</h2>
      <pre id="debug-output">正在初始化...</pre>
    </div>
    <div id="app">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:50vh;color:#8b949e;">
        加载中...
      </div>
    </div>
    
    <script type="module">
      const debugOutput = document.getElementById('debug-output');
      const logs = [];
      
      function log(msg, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        logs.push(`[${timestamp}] ${msg}`);
        debugOutput.textContent = logs.join('\n');
        console.log(`[DEBUG] ${msg}`);
      }
      
      window.onerror = function(msg, url, line, col, error) {
        log(`❌ JS错误: ${msg} (${url}:${line}:${col})`, 'error');
        if (error && error.stack) {
          log(`堆栈: ${error.stack.split('\n').slice(0, 3).join('\n')}`, 'error');
        }
      };
      
      window.addEventListener('unhandledrejection', function(event) {
        log(`❌ Promise错误: ${event.reason}`, 'error');
        if (event.reason && event.reason.stack) {
          log(`堆栈: ${event.reason.stack.split('\n').slice(0, 3).join('\n')}`, 'error');
        }
      });
      
      log('✅ 页面开始加载');
      
      // 检查 Vue 是否加载
      setTimeout(() => {
        const appEl = document.getElementById('app');
        const loadingEl = document.getElementById('app-loading');
        
        if (loadingEl && loadingEl.parentNode === appEl) {
          log('⚠️ 5秒后 Vue 未挂载，loading 仍然显示', 'warning');
        } else {
          log('✅ Vue 已挂载，loading 已替换', 'success');
          log(`#app 内容长度: ${appEl.innerHTML.length} 字符`);
          log(`#app 子元素数量: ${appEl.children.length}`);
          
          // 检查是否有任何可见内容
          const computedStyle = window.getComputedStyle(appEl);
          log(`#app display: ${computedStyle.display}`);
          log(`#app visibility: ${computedStyle.visibility}`);
          log(`#app opacity: ${computedStyle.opacity}`);
          log(`#app height: ${computedStyle.height}`);
        }
      }, 5000);
      
      log('正在加载 Vue 应用...');
    </script>
    <script type="module" crossorigin src="/assets/index-D7HUltBA.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-4s3OWl2j.css" />
  </body>
</html>

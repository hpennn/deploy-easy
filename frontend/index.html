<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>智能部署助手</title>
    <script type="module" crossorigin src="/src/main.js"></script>
    <style>
      #app-loading { display:flex; align-items:center; justify-content:center; height:100vh; background:#0d1117; color:#c9d1d9; font-family:-apple-system,sans-serif; font-size:14px; }
      #app-loading .spinner { width:24px; height:24px; border:3px solid #30363d; border-top-color:#58a6ff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:12px; }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <body>
    <div id="app">
      <div id="app-loading"><div class="spinner"></div>加载中...</div>
    </div>
  </body>
</html>
